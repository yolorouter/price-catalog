# Refresh the price catalog daily.
#
# Runs the Node fetchers in scripts/providers/ against each provider's
# server-side data endpoint, normalizes the results, validates against the
# catalog contract (CNY / per_million_tokens, snake_case slots), then commits
# catalog.json back to this branch and writes a copy to the Cloudflare KV
# namespace that the distribution Worker serves from.
#
# Best-effort refresh: a provider that fails (network timeout, page change) is
# skipped and keeps its existing entries — one unreachable provider can't block
# the rest. Several providers are on domestic domains intermittently unreachable
# from this runner, so abort-on-failure would make the cron fail constantly for
# transient reasons. Failures are logged with the full cause chain in the run
# log; see scripts/refresh.mjs.
#
# Public repo → unlimited free GitHub Actions minutes. The cron picks a low-
# traffic hour; manual dispatch is wired for on-demand refreshes.

name: refresh-price-catalog

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC ≈ 02:00 CST, low traffic
  workflow_dispatch: {} # manual trigger

permissions:
  contents: write # commit catalog.json back

# A scheduled run and a manual dispatch should not race: the later one wins and
# the earlier is cancelled, so two refreshes never commit on top of each other.
concurrency:
  group: refresh-price-catalog
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Headless rendering (3 providers) + 9 fetches; bound the whole job so a
    # stuck endpoint or hung browser cannot hold a runner indefinitely.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Three providers (DeepSeek/Baichuan/Volcengine) render their prices
      # client-side, so the fetchers drive a headless browser. --with-deps
      # installs the OS libraries chromium needs on the ubuntu runner.
      - name: Install playwright chromium
        run: npm install playwright && npx playwright install --with-deps chromium

      - name: Refresh prices
        run: node scripts/refresh.mjs catalog.json

      # The gate between "fetched some numbers" and "committed them": the
      # contract validator. The Go consumer re-validates on load, but by then
      # a bad file has shipped — this keeps contract breaks out of the repo.
      - name: Validate the refreshed catalog
        run: node scripts/validate.mjs catalog.json

      # Commit only when something actually changed. `git diff --quiet` exits
      # non-zero on a diff, which the `if` guards against creating an empty commit.
      - name: Commit catalog.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- catalog.json; then
            git add catalog.json
            git commit -m "chore(price-catalog): daily refresh ($(date -u +%F))"
            git push
          else
            echo "no price changes to commit"
          fi

      # Push the catalog to the distribution KV namespace. The Worker
      # (prices.yolorouter.com) reads this key; yolorouter instances fetch it
      # via their background refresh loop. CF_API_TOKEN / CF_ACCOUNT_ID /
      # PRICE_CATALOG_KV_ID come from repo Secrets. The `secrets` context is
      # NOT a valid named-value in a step `if:` expression, so we guard inside
      # the shell: if the token is empty (a fork without the Worker
      # provisioned), the step no-ops and the git commit above still refreshed
      # the repo copy.
      - name: Write catalog to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PRICE_CATALOG_KV_ID: ${{ secrets.PRICE_CATALOG_KV_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "CF_API_TOKEN not set — skipping KV push (repo copy already refreshed)"
            exit 0
          fi
          # kv key put's value argument is a literal string, not a path —
          # passing the file path would store the string "./catalog.json"
          # as the value. "$(cat ...)" feeds the file contents. --remote writes
          # to the real Cloudflare KV; without it wrangler writes to a local
          # Miniflare that dies with the runner.
          #
          # The write hits an intermittent Cloudflare-side
          # "get namespace: 'namespace not found' [10013]" on namespace-scoped
          # endpoints: the namespace is healthy (the Worker serves from it
          # daily) but some API nodes fail to resolve it — observed across
          # tokens, wrangler versions, and origins, with retries landing on
          # healthy nodes. Retries are load-bearing, not cosmetic.
          # wrangler stays pinned to 4.86.0, the version the previous CI used
          # daily; unpin only together with re-verifying this write path.
          for i in 1 2 3 4 5; do
            if npx wrangler@4.86.0 kv key put \
              --namespace-id="$PRICE_CATALOG_KV_ID" \
              --remote \
              catalog.json "$(cat ./catalog.json)"; then
              echo "KV write succeeded on attempt $i"
              exit 0
            fi
            echo "KV write attempt $i failed"
            if [ "$i" -lt 5 ]; then
              echo "retrying in 30s"
              sleep 30
            fi
          done
          echo "KV write failed after 5 attempts"
          exit 1
